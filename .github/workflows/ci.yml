# The phase gate, run automatically on every push and pull request.
# Backend: lint, tests on SQLite, migrations, tests on Postgres.
# Frontend: lint, format, types, unit tests, build, browser tests.
# Contract: the frontend is built against the API as it is now.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerlet
          POSTGRES_PASSWORD: ledgerlet
          POSTGRES_DB: ledgerlet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LEDGERLET_DATABASE_URL: postgresql+psycopg://ledgerlet:ledgerlet@localhost:5432/ledgerlet

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install
        # Exact versions from the lock file, so CI tests what will run.
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Tests (SQLite)
        run: python -m pytest

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Models and migrations agree
        run: alembic check

      - name: Create test database
        run: PGPASSWORD=ledgerlet psql -h localhost -U ledgerlet -d ledgerlet -c "CREATE DATABASE ledgerlet_test;"

      - name: Tests (Postgres)
        env:
          LEDGERLET_TEST_DATABASE_URL: postgresql+psycopg://ledgerlet:ledgerlet@localhost:5432/ledgerlet_test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (phone, tablet, laptop, with accessibility checks)
        run: npm run test:e2e

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  contract:
    # Regenerates, from the backend, what the frontend is built against: the API
    # description, the TypeScript types, and the sample-data responses its tests use.
    # Fails if any has changed without being committed. (The backend's versions are
    # pinned in requirements-dev.lock, so openapi.json comes out the same every time.)
    # If this fails: `python -m scripts.export_frontend_contract`, then in frontend/
    # `npm run api:types`, and commit the result.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
          npm ci --prefix frontend

      - name: Export the contract from the backend
        run: python -m scripts.export_frontend_contract

      - name: Generate the frontend's API types
        run: npm run api:types --prefix frontend

      - name: The frontend is built against the current API
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts frontend/src/test/fixtures
