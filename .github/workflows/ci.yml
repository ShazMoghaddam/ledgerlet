# The phase gate, run automatically on every push and pull request.
# Backend: lint, tests on SQLite, migrations, tests on Postgres, and the frontend contract.
# Frontend: generated types current, lint, format, types, unit tests, build, browser tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerlet
          POSTGRES_PASSWORD: ledgerlet
          POSTGRES_DB: ledgerlet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LEDGERLET_DATABASE_URL: postgresql+psycopg://ledgerlet:ledgerlet@localhost:5432/ledgerlet

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (SQLite)
        run: python -m pytest

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Models and migrations agree
        run: alembic check

      - name: Frontend contract matches the API
        # The API description and sample responses the frontend is built against.
        # If this fails: run `python -m scripts.export_frontend_contract` and commit.
        run: |
          python -m scripts.export_frontend_contract
          git diff --exit-code -- frontend/openapi.json frontend/src/test/fixtures

      - name: Create test database
        run: PGPASSWORD=ledgerlet psql -h localhost -U ledgerlet -d ledgerlet -c "CREATE DATABASE ledgerlet_test;"

      - name: Tests (Postgres)
        env:
          LEDGERLET_TEST_DATABASE_URL: postgresql+psycopg://ledgerlet:ledgerlet@localhost:5432/ledgerlet_test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: API types match openapi.json
        # If this fails: run `npm run api:types` and commit src/api/schema.d.ts.
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (phone, tablet, laptop, with accessibility checks)
        run: npm run test:e2e

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
