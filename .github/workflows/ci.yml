# The phase gate, run automatically on every push and pull request.
# Same checks as locally: lint, tests on SQLite, migrations, tests on Postgres.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerlet
          POSTGRES_PASSWORD: ledgerlet
          POSTGRES_DB: ledgerlet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LEDGERLET_DATABASE_URL: postgresql+psycopg://ledgerlet:ledgerlet@localhost:5432/ledgerlet

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (SQLite)
        run: python -m pytest

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Models and migrations agree
        run: alembic check

      - name: Create test database
        run: PGPASSWORD=ledgerlet psql -h localhost -U ledgerlet -d ledgerlet -c "CREATE DATABASE ledgerlet_test;"

      - name: Tests (Postgres)
        env:
          LEDGERLET_TEST_DATABASE_URL: postgresql+psycopg://ledgerlet:ledgerlet@localhost:5432/ledgerlet_test
        run: python -m pytest
