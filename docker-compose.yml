services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerlet
      POSTGRES_PASSWORD: ledgerlet
      POSTGRES_DB: ledgerlet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
